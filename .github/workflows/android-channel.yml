name: HAPI Android channel
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: android-channel
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'b1ghawk119/hapi' && github.ref == 'refs/heads/android-channel'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      code: ${{ steps.plan.outputs.code }}
      upstream: ${{ steps.plan.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-channel
          fetch-depth: 0
      - run: bash .github/channel/sync.sh
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          code=$(git rev-list --count HEAD)
          tag=android-$code
          # Missing releases (including a previous failed build) are retried.
          published=$(gh api --paginate 'repos/{owner}/{repo}/releases?per_page=100' --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id")
          echo "publish=$([[ -z $published ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "upstream=$(cat .github/channel/upstream)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: ./gradlew -PhapiGithubChannel=true :core:protocol:test :app:testDebugUnitTest --tests 'app.hapi.companion.ChannelUpdateTest' :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          retention-days: 1
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    environment: android-channel
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release
          path: unsigned
      - name: Sign and verify the installable APK
        env:
          KEYSTORE: ${{ secrets.CHANNEL_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.CHANNEL_PASSWORD }}
          CODE: ${{ needs.sync.outputs.code }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/channel.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$key"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" sign --ks "$key" --ks-key-alias channel --ks-pass env:KEY_PASSWORD --out HAPI.apk unsigned/app-release-unsigned.apk
          "$tools/apksigner" verify --verbose --print-certs HAPI.apk
          package=$("$tools/aapt" dump badging HAPI.apk | sed -n '1p')
          [[ "$package" == "package: name='run.hapi.companion.b1ghawk119' versionCode='$CODE' "* ]]
          jq -e --argjson code "$CODE" '.elements | select(length == 1) | .[0] | select(.versionCode == $code) | {versionCode, versionName:(.versionName + " (#" + ($code|tostring) + ")")}' unsigned/output-metadata.json > update.json
      - name: Publish APK and update feed together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.sync.outputs.sha }}
          CODE: ${{ needs.sync.outputs.code }}
          UPSTREAM: ${{ needs.sync.outputs.upstream }}
        run: |
          set -euo pipefail
          tag=android-$CODE
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SHA" --draft --title "HAPI Android $(jq -r .versionName update.json)" \
              --notes "Install **HAPI.apk**. Future updates appear inside the app. 首次安装请选择 HAPI.apk；后续可在应用内升级。 Upstream Android: https://github.com/tiann/hapi/commit/$UPSTREAM · Fork source: https://github.com/$GH_REPO/commit/$SHA"
          fi
          gh release upload "$tag" HAPI.apk update.json --clobber
          gh release edit "$tag" --draft=false --latest
